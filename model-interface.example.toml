# Copy to model-interface.toml. Values written as "env:NAME" are read from the environment.

record = "~/.model-interface/streams.jsonl"  # one line per finished stream: request, blocks, timings

[keys]                                 # what callers present, by name; never a provider's key
team-a = "env:MI_KEY"

[providers.anthropic]                  # reached with the Anthropic SDK; serves /v1/messages
format = "anthropic"
url = "https://api.anthropic.com"
key = "env:ANTHROPIC_API_KEY"

[providers.openai]                     # reached with the OpenAI SDK; serves /v1/chat/completions
format = "openai"
url = "https://api.openai.com/v1"
key = "env:OPENAI_API_KEY"

[providers.groq]
format = "openai"
url = "https://api.groq.com/openai/v1"
key = "env:GROQ_API_KEY"

[providers.ollama]                     # local, in Messages format; no key
format = "anthropic"
url = "http://localhost:11434"

[providers.ollama-openai]              # the same local model, in Chat Completions format
format = "openai"
url = "http://localhost:11434/v1"

[models]                               # the aliases callers use; each speaks its provider's format
coder = { provider = "anthropic", model = "claude-sonnet-5-5" }
gpt = { provider = "openai", model = "gpt-5" }
fast = { provider = "groq", model = "llama-3.3-70b-versatile" }
local = { provider = "ollama", model = "qwen2.5:3b" }
local-openai = { provider = "ollama-openai", model = "qwen2.5:3b" }
