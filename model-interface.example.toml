# Copy to model-interface.toml. Values written as "env:NAME" are read from the environment.

record = "~/.model-interface/record.jsonl"   # one line per run

[keys]                                 # what callers present, by name; never a provider's key
team-a = "env:MI_KEY"

[providers.anthropic]                  # Claude, in Messages format
format = "anthropic"
url = "https://api.anthropic.com"
key = "env:ANTHROPIC_API_KEY"

[providers.anthropic-openai]           # the same Claude, through Anthropic's Chat Completions compatibility endpoint
format = "openai"
url = "https://api.anthropic.com/v1"
key = "env:ANTHROPIC_API_KEY"

[providers.groq]
format = "openai"
url = "https://api.groq.com/openai/v1"
key = "env:GROQ_API_KEY"

[providers.local]                      # Ollama; no key needed
format = "openai"
url = "http://localhost:11434/v1"

[models]                               # the aliases callers use
coder = { provider = "anthropic", model = "claude-sonnet-5-5" }
coder-openai = { provider = "anthropic-openai", model = "claude-sonnet-5-5" }
fast = { provider = "groq", model = "llama-3.3-70b-versatile" }
local = { provider = "local", model = "qwen2.5:3b" }
