[project]
name = "model-interface"
version = "0.1.0"
description = "Model calls and tool execution, taken out of the agent and put behind one endpoint, in a sandbox."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-interface = "model_interface.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model_interface"]
