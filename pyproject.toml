[project]
name = "model-interface"
version = "0.1.0"
description = "A gateway for model calls with real-time observability: native pass-through in both wire formats, streaming only, every stream recorded block by block as it runs."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "anthropic>=0.50", "openai>=1.70"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-interface = "model_interface.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model_interface"]

[tool.setuptools.package-data]
model_interface = ["ui.html"]
